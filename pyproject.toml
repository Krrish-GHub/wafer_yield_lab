[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wafer-yield-lab"
version = "1.0.0"
description = "An explainable, reproducible semiconductor yield-classification lab using UCI SECOM."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Krrish Sharma"}]
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scikit-learn>=1.4,<2", "joblib>=1.3,<2", "requests>=2.31,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
wafer-yield = "wafer_yield_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wafer_yield_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
